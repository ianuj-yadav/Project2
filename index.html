<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Premium Figure</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section id="stage">
            <h1>Interactive Companion</h1>
            <p>A demonstration of smooth JavaScript animations, parallax eye-tracking, and state-driven interactions. Move your mouse or click the buttons below!</p>
            
            <div class="figure-wrapper">
                <div class="human" id="character">
                    <div class="head" id="head">
                        <div class="eyes">
                            <div class="eye" id="eye-l"></div>
                            <div class="eye" id="eye-r"></div>
                        </div>
                        <div class="mouth" id="mouth"></div>
                    </div>
                    <div class="body">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>

            <div class="emote-panel">
                <button class="emote-btn" data-emote="wave">👋 Wave</button>
                <button class="emote-btn" data-emote="jump">🚀 Jump</button>
                <button class="emote-btn" data-emote="shiver">❄️ Shiver</button>
                <button class="emote-btn" data-emote="reset">🔄 Reset</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
